name: flacron_auto_social
description: "Flacron Auto Social — AI-powered social media management SaaS platform."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # ---- State management ----
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ---- Routing ----
  go_router: ^14.2.7

  # ---- Firebase ----
  firebase_core: ^3.4.1
  firebase_auth: ^5.2.1
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.1
  cloud_functions: ^5.1.2

  # ---- UI ----
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  table_calendar: ^3.1.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0

  # ---- Utilities ----
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  webview_flutter: ^4.9.0
  qr_flutter: ^4.1.0
  timeago: ^3.7.0
  uuid: ^4.5.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

